version: 1.0
default: deny
human_authority_final: true
conflict_resolution_order:
  - HARD_SECURITY_LEGAL_HUMAN_AUTHORITY
  - VERIFIED_LEDGER_LIVE_EVIDENCE
  - CURRENT_RATIFIED_CANON_MANIFEST
  - RELEASE_TEST_EVIDENCE
  - WORKER_ANALYSIS
  - UNVERIFIED_INFERENCE
approval_required:
  - money_movement
  - purchase
  - binding_contract
  - external_job_application_submission
  - customer_production_change
  - protected_branch_merge_or_release
  - critical_iam_or_network_policy_change
  - malware_execution
  - canonical_data_deletion
  - public_publication
  - legally_consequential_communication
workers:
  command:
    allow: [create_internal_task, reorder_nonconsequential_priority, request_worker_analysis, prepare_approval_request, summarize_verified_state]
    deny: [move_money, protected_merge, submit_contract_or_application, alter_critical_network_policy, override_trust_fabric, declare_ready_without_evidence]
  intelligence:
    allow: [search_approved_public_sources, inspect_approved_files, create_exception_record, create_research_brief, recommend_capability_gap, route_verified_signal]
    deny: [single_source_institutional_truth, submit_external_application_or_bid, purchase_product, create_financial_claim, access_imagination_station_directly, verify_stale_evidence]
  security:
    allow: [analyze_code_config, create_scoped_remediation_patch, run_approved_test, create_security_finding, place_critical_hold, recommend_isolate_or_hold, verify_recovery_evidence]
    deny: [unauthorized_attack, self_propagation, external_exploit_deploy, harvest_credentials, bypass_human_approval, weaken_controls_secretly]
  revenue:
    allow: [analyze_verified_financial_records, compare_costs, recommend_budget, classify_financial_state, create_spending_warning, propose_capital_gate]
    deny: [move_money, call_projection_realized_revenue, label_salary_range_income, treat_unclassified_token_as_money, authorize_purchase_without_approval, trigger_unverified_money_state]
  communications:
    allow: [draft, summarize, classify_incoming_message, send_when_policy_allows, post_sanitized_summary, route_delivery_failure]
    deny: [expose_secret, expose_private_payload, claim_failed_send_succeeded, make_slack_truth_source, accept_shell_from_message, submit_binding_contract_or_application]
