version: 1.0
name: CCC_REMOTE_SOVEREIGNTY_EMPLOYMENT_LAW
state: LOCKED
mode: MARKET_CHAMELEON_ADVISORY_INTELLIGENCE_ONLY
human_command_authority_required_for_external_release: true
employment_location:
  required: 100_PERCENT_REMOTE
  home_lab_only: true
  reject_if:
    - HYBRID
    - ONSITE
    - MANDATORY_OFFICE_ATTENDANCE
    - RELOCATION
    - REGULAR_TRAVEL
    - FIELD_SERVICE
    - IN_PERSON
    - REMOTE_AFTER_TRAINING
  employer_location_requirements: VERIFY_BEFORE_ADVANCEMENT
operator_devices:
  authorized_interfaces: [LAPTOP, TABLET, PHONE]
  remote_location_control: NON_NEGOTIABLE
  personal_device_ownership: PREFERENCE_SECURITY_CONTRACT_DEPENDENT
  multi_device_access: REQUIRED_WHERE_POLICY_SAFELY_ALLOWS
  employer_managed_device:
    allowed: true
    conditions:
      - WORK_REMAINS_100_PERCENT_REMOTE
      - CCC_HOME_LAB_SEPARATION_NOT_COMPROMISED
      - EMPLOYER_SECURITY_CONTROLS_UNDERSTOOD
security_boundary:
  employer_controls_may_include: [COMPANY_MANAGED_LAPTOP, MDM, VPN, ZTNA, MFA, RESTRICTED_MOBILE_ACCESS, VDI, NO_PERSONAL_DEVICE_STORAGE, GEOGRAPHIC_OR_STATE_RESTRICTIONS]
  rule: REMOTE_LOCATION_IS_HARD_GATE_DEVICE_OWNERSHIP_IS_POLICY_DEPENDENT
hard_gates:
  R-01: {requirement: 100_PERCENT_REMOTE, failure: REJECT}
  R-02: {requirement: NO_MANDATORY_OFFICE_ATTENDANCE, failure: REJECT}
  R-03: {requirement: NO_RELOCATION, failure: REJECT}
  R-04: {requirement: NO_REGULAR_TRAVEL, failure: REJECT}
  R-05: {requirement: SECURED_HOME_LAB_COMPATIBLE, failure: REJECT_OR_HOLD}
  R-06: {requirement: COMPENSATION_VERIFIED, failure: MARKET_SIGNAL}
  R-07: {requirement: DUTIES_MAP_TO_PROVEN_OR_TRAINABLE_CCC_CAPABILITIES, failure: SCORE}
  R-08: {requirement: WORK_SCHEDULE_COMPATIBLE_WITH_CCC_OPERATIONS, failure: SCORE}
  R-09: {requirement: DEVICE_AND_SECURITY_CONTROLS_UNDERSTOOD, failure: VERIFY}
  R-10: {requirement: HUMAN_COMMAND_AUTHORITY_APPROVES_RELEASE, failure: REQUIRED}
market_chameleon_search_universe:
  - REMOTE_SOC_ANALYST
  - REMOTE_CYBERSECURITY_ANALYST
  - REMOTE_VULNERABILITY_ANALYST
  - REMOTE_INCIDENT_RESPONSE
  - REMOTE_THREAT_INTELLIGENCE
  - REMOTE_GRC
  - REMOTE_IAM
  - REMOTE_CLOUD_SECURITY
  - REMOTE_SECURITY_OPERATIONS
  - REMOTE_SIEM_EDR_XDR
  - REMOTE_NETWORK_SECURITY
  - REMOTE_NOC
  - REMOTE_SYSTEM_ADMINISTRATION
  - REMOTE_LINUX_ADMINISTRATION
  - REMOTE_ENDPOINT_MANAGEMENT
  - REMOTE_IT_SUPPORT
  - REMOTE_MSP_MSSP
  - REMOTE_TECHNICAL_SUPPORT
  - REMOTE_AI_SECURITY
  - REMOTE_AI_GOVERNANCE
  - REMOTE_SECURITY_CONSULTING
  - REMOTE_CONTRACT_1099
  - REMOTE_FREELANCE_TECHNICAL_WORK
  - REMOTE_TECHNICAL_PROJECT_OPERATIONS
negative_filters:
  - HYBRID
  - ONSITE
  - RELOCATION
  - FIELD_SERVICE
  - TRAVEL_REQUIRED
  - OFFICE_DAYS
  - IN_PERSON
  - REMOTE_AFTER_TRAINING
advisory_flow:
  - DISCOVER
  - REMOTE_VERIFY
  - ROLE_TWIN
  - GAP_ANALYSIS
  - SELF_IMPROVEMENT
  - LAB_PROOF
  - RELEASE_READINESS
external_execution_flow_when_human_gate_opens:
  - APPLICATION
  - INTERVIEW
  - OFFER
  - HUMAN_DECISION
  - REMOTE_WORK
  - REVENUE
  - REINJECTION
market_record_fields:
  - ROLE
  - INDUSTRY
  - COMPENSATION
  - REMOTE_STATUS
  - EMPLOYER_LOCATION_RESTRICTIONS
  - TOOLS
  - FRAMEWORKS
  - CERTIFICATIONS
  - EXPERIENCE
  - RESPONSIBILITIES
  - SECURITY_CLEARANCE
  - AUTOMATION_EXPECTATIONS
  - AI_EXPECTATIONS
  - PORTFOLIO_EXPECTATIONS
  - DEVICE_SECURITY_CONTROLS
  - CCC_CURRENT_CAPABILITY
  - CCC_GAP
  - TRANSFERABLE_CAPABILITY
  - NEXT_ALPHA
economic_objective: CCC_CAPABILITY_TO_REMOTE_COMPETENCY_TO_VERIFIED_VALUE_TO_REMOTE_REVENUE_TO_REINVESTMENT
current_priority_lock:
  active_physical_gate: LINK-01_HP_RECEIVER_VERIFICATION
  employment: REMOTE_ONLY_INTELLIGENCE_ACTIVE_EXTERNAL_RELEASE_NOT_AUTHORIZED
  soc: PRIORITY_OPERATIONALIZATION
  capital: REQUIRED
  pr4: FROZEN
  pr6: DRAFT_UNTOUCHED
  omega: NOT_CLAIMED
