version: 1.0
id: CCC_BLOOM_RESERVE
state: SEED
owner: security
purpose: Convert faults into preserved learning capacity without misclassifying failure as success.
truth_rule: FAILURE_DOES_NOT_BECOME_POSITIVE_BY_DECLARATION
loop:
  - FAULT
  - CONTAIN
  - PRESERVE
  - OBSERVE
  - ROOT_CAUSE_OR_UNKNOWN
  - RECOVER
  - REGRESSION_GUARD
  - LEARNING_CAPSULE
  - GROWTH_SEED
  - NEXT_ALPHA
value_outputs: [PRESERVED_EVIDENCE, ROOT_CAUSE_KNOWLEDGE, RECOVERY_CAPABILITY, REGRESSION_GUARD, REDUCED_FUTURE_LOSS, GROWTH_SEED]
unknown_rule: UNKNOWN_REMAINS_UNKNOWN_UNTIL_EVIDENCE
human_authority_boundary: true
example_pattern:
  fault: HP_LINK_FAILS
  response: [E3_DETECTS_LOSS, E7_ISOLATES_NETWORK_LAYER, E6_PRESERVES_PREVIOUS_VALID_EVIDENCE, E1_PREVENTS_UNAUTHORIZED_REPAIR, E8_CAPTURES_ROOT_CAUSE_OR_UNKNOWN, WATCHDOG_PATTERN_BECOMES_REUSABLE_CAPABILITY]
priority_guard:
  active_physical_gate: LINK-01_HP_RECEIVER_VERIFICATION
  rule: BLOOM_RESERVE_MAY_CAPTURE_LEARNING_BUT_MUST_NOT_DISPLACE_ACTIVE_GATE
