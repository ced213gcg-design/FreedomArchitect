schema: ccc.full_operations_sop.unc_world.v1
version: "1.0"
state: LOCKED
scope: [COMMAND, INTELLIGENCE, SECURITY, REVENUE, COMMS, UNC_OVERSIGHT]
mission_cycle: [SENSE, CLASSIFY, VERIFY, ROUTE, ACT_OR_HOLD, RECORD, LEARN, REINJECT]
truth_rule: No alert, headline, email, opportunity, or inference becomes factual state without evidence.

authority_order:
  - HUMAN_COMMAND_AUTHORITY
  - SECURITY_LEGAL_HARD_CONTROLS
  - VERIFIED_LEDGER_MACHINE_EVIDENCE
  - RATIFIED_CCC_CANON
  - TEST_RELEASE_EVIDENCE
  - WORKER_ANALYSIS
  - UNVERIFIED_INFERENCE
unc:
  constitutional_worker: false
  role: coordinate_and_grade_five_workers
  override_human_command: false
  cycle: [OBSERVE, GRADE, IDENTIFY_ONE_MATERIAL_DEFECT, ASSIGN_OWNER, PRESERVE_WHAT_WORKED, REINJECT_LESSON, IMPROVE_NEXT_CYCLE]
  law: MINIMUM_CORRECTION_MAXIMUM_VERIFIED_IMPROVEMENT

workers:
  COMMAND:
    owns: [SEQUENCE, BLOCKERS, SUPERSTATE, PRIORITY, RELEASE_GATES, NEXT_ACTION]
    question: What must happen next?
  INTELLIGENCE:
    owns: [RESEARCH, TECHNOLOGY_SIGNALS, MARKET_SIGNALS, ROLE_TWINS, TREND_ANALYSIS, GAP_DISCOVERY, CRAYOLA, GAME_THEORY]
    question: What are we missing, and what changes the decision?
  SECURITY:
    owns: [PRIVACY, IDENTITY, CLAIM_VALIDATION, CREDENTIAL_BOUNDARY, SOFTWARE_TRUST, CI_TRUST, SENSOR_TRUST, HOLD_AUTHORITY]
    question: What can hurt the organism or falsify the truth?
  REVENUE:
    owns: [EMPLOYMENT_PIPELINE_INTERNAL, CONTRACT_PIPELINE, COMPENSATION, COST, COLLECTED_INCOME_TRUTH, CAPITAL_BLOOM, REINVESTMENT]
    question: What verified capability can become productive value?
    employment_note: Internal/advisory only while Human Command external-release gate is CLOSED.
  COMMS:
    owns: [INBOUND_COMMUNICATION, OUTBOUND_PACKAGING, REPORTING, RESUME_DERIVATIVES_INTERNAL, EXECUTIVE_SUMMARIES, SANITIZATION, HANDOFF_CLARITY]
    question: What must be understood, preserved, or communicated?

universal_intake:
  categories: [PRIVATE_MATERIAL, SECURITY_SIGNAL, TECHNOLOGY_SIGNAL, EMPLOYMENT_SIGNAL, REVENUE_SIGNAL, CI_BUILD_SIGNAL, PHYSICAL_LAB_SIGNAL, GENERAL_INFORMATION, UNKNOWN]
  required_fields: [FACT, RISK, ACTION, SOURCE, TIME, OWNER, CHANGE, VALIDATION, PROVENANCE]
  incomplete_states: [UNKNOWN, UNVERIFIED, HOLD]
  never_infer_pass_from_appearance: true

private_identity_credit:
  flow: [COMMS_RECEIVES, SANITIZE, NO_ACCOUNT_DETAILS_PROPAGATED, SECURITY_CLASSIFICATION, HUMAN_COMMAND, OFFICIAL_KNOWN_CHANNEL, HUMAN_INSPECTION, SANITIZED_RESULT_ONLY]
  prohibited: [CLICK_EMAIL_LINK, AUTOMATED_LOGIN, PASSWORD_CAPTURE, ACCOUNT_DETAIL_PROPAGATION, AUTOMATED_CREDIT_ACTION, AUTOMATED_DISPUTE, AUTOMATED_FREEZE, MONEY_MOVEMENT]
  evidence_rule: An alert email proves an alert occurred, not unauthorized activity.

technology_signal:
  route: INTELLIGENCE
  not_route: ARCHITECTURE_CHANGE
  checks: [SOURCE_QUALITY, RELEVANCE, CCC_APPLICABILITY, DUPLICATION, SECURITY_RISK, COST, MATURITY, EVIDENCE]
  crayola: [CORRECT, RESEARCH, ANALYZE, YIELD_EVIDENCE, OBSERVE, LEARN, AMEND]
  outcomes: [EVIDENCE, CAPABILITY, MEMORY, SEED, DOCUMENTED_REJECTION]

crayola_q:
  Q1_FACT: What is proven?
  Q2_CONTRADICTION: What conflicts with current state?
  Q3_ADVANTAGE: What lawful advantage exists?
  Q4_FAILURE: What breaks next?
  Q5_COST: What does this consume?
  Q6_REUSE: What CCC asset already solves part of it?
  Q7_AUTOMATION: What can safely become hands-off?
  Q8_HUMAN: Where must Human Command remain decisive?
  collapse_rule: Select the smallest evidence-supported action that increases VERIFIED_VALUE_VELOCITY.

verified_value_velocity:
  symbol: V=
  meaning: VERIFIED_VALUE_VELOCITY
  chain: [CAPABILITY, EVIDENCE, EMPLOYER_READABLE_PROOF, OPPORTUNITY, BOOKED_WORK, EARNED_REVENUE, COLLECTED_INCOME, REINVESTMENT, STRONGER_CAPABILITY]
  optimize: MAXIMUM_VERIFIED_VALUE_DIVIDED_BY_MINIMUM_WASTED_MOTION
  negative_v: [FALSE_CLAIMS, PRIVACY_LOSS, BAD_HIRES, BROKEN_INFRASTRUCTURE, UNSUPPORTED_PASS]

ci_software_trust:
  current_known_signal: e106abb_FAILURE
  newer_message_observed: false
  state: HOLD
  rule: NO_NEW_MESSAGE_DOES_NOT_EQUAL_CI_PASS
  path: [CI_SIGNAL, SECURITY, EXACT_HEAD, EXACT_WORKFLOW, EXACT_RESULT, MACHINE_EVIDENCE, STATE_UPDATE]

physical_soc_gate:
  active_gate: LINK-01_HP_RECEIVER_VERIFICATION
  progression: [LINK-01, LINK-02, AUTHENTICATED_TRANSPORT, SENSOR_VISIBILITY, SOC_CONTROL_GATES, DETECTION_SCENARIOS, TIMESTAMP_HASH_RECONCILIATION, LEDGER, DASHBOARD, HUMAN_REVIEW]
  rules: [NO_PASS_WITHOUT_MACHINE_EVIDENCE, NO_EXTERNAL_TARGETS, NO_SECRET_PROPAGATION, NO_ARBITRARY_COMMAND_CHANNEL, NO_GAMMA_PROMOTION_FROM_CHAT_ALONE]

employment:
  location_policy: REMOTE_ONLY
  mode: ADVISORY_INTERNAL_PREPARATION
  external_release: CLOSED
  allowed_while_closed: [DISCOVER, FILTER, ROLE_TWIN, GAP_MAP, RESUME_DRAFT_INTERNAL, PORTFOLIO_SELECT, INTERVIEW_PREP_INTERNAL, PIPELINE_ANALYSIS]
  prohibited_while_closed: [APPLICATION_SUBMISSION, RECRUITER_CONTACT, INTERVIEW_COMMITMENT, NEGOTIATION, ATTESTATION, EMPLOYMENT_ACCEPTANCE]
  hard_gates:
    R-01: {requirement: 100_PERCENT_REMOTE, failure: REJECT}
    R-02: {requirement: NO_MANDATORY_OFFICE, failure: REJECT}
    R-03: {requirement: NO_RELOCATION, failure: REJECT}
    R-04: {requirement: NO_REGULAR_TRAVEL, failure: REJECT}
    R-05: {requirement: SECURED_HOME_LAB_OPERABILITY, failure: REJECT_OR_HOLD}
    R-06: {requirement: COMPENSATION_VERIFIED, result: MARKET_SIGNAL}
    R-07: {requirement: CAPABILITY_FIT, result: SCORE}
    R-08: {requirement: SCHEDULE_COMPATIBILITY, result: SCORE}
    R-09: {requirement: DEVICE_SECURITY_POLICY_UNDERSTOOD, result: VERIFY}
    R-10: {requirement: HUMAN_RELEASE_AUTHORITY, result: REQUIRED}

revenue_truth_ladder: [MARKET_SIGNAL, PIPELINE, ENGAGEMENT, QUALIFIED_PIPELINE, COMMITTED_OPPORTUNITY, BOOKED_WORK, EARNED_REVENUE, COLLECTED_INCOME]
settled_cash_state: COLLECTED_INCOME

comms_materiality:
  C0: NO_MATERIAL_IMPACT
  C1: INFORMATIONAL
  C2: ACTIONABLE_INTERNAL
  C3: MATERIAL_SECURITY_PRIVATE_REVENUE
  C4: HUMAN_COMMAND_REQUIRED
  C5: EMERGENCY_IMMEDIATE_CONTAINMENT

private_data_law:
  rule: MINIMUM_NECESSARY_DISTRIBUTION
  never_propagate: [PASSWORDS, TOKENS, PRIVATE_KEYS, CREDIT_ACCOUNT_NUMBERS, FULL_IDENTIFIERS, BANK_DATA, UNNECESSARY_ADDRESS_DATA, SECURITY_ANSWERS]
  store_only: [EVENT_CLASS, TIMESTAMP, OWNER, STATE, NEXT_ACTION, SANITIZED_RESULT]

worker_handoff_contract:
  required: [STARTING_POSITION, WORK_COMPLETED, EVIDENCE, CURRENT_POSITION, BLOCKERS, WHERE_WORK_STOPPED, NEXT_OWNER, EXACT_NEXT_ACTION, EXPECTED_NEXT_EVIDENCE]
  prohibited_ambiguity: [looks_good, probably_fixed, should_work]

fault_handling:
  cycle: [FAULT, CONTAIN, PRESERVE, CLASSIFY, ROOT_CAUSE_OR_UNKNOWN, RECOVER, VERIFY, REGRESSION_GUARD, LESSON, REINJECTION]
  allowed_end_states: [PASS, PARTIAL, HOLD, FAIL, UNKNOWN]
  no_visual_momentum_pass: true

positive_event_handling:
  required_outputs: [EVIDENCE, REPLICATION_RECIPE, ENABLING_DEPENDENCIES, VALUE, MICRO_EFFECT, MACRO_EFFECT, NEXT_ALPHA]

escalation_matrix:
  PRIVATE_IDENTITY_CREDIT: {primary: SECURITY, secondary: [COMMS], human: REQUIRED}
  CI_FAILURE: {primary: SECURITY, secondary: [COMMAND], human: IF_RELEASE_IMPACT}
  TECHNOLOGY_NEWS: {primary: INTELLIGENCE, secondary: [SECURITY], human: NOT_NORMALLY}
  JOB_OPPORTUNITY: {primary: INTELLIGENCE, secondary: [REVENUE, COMMS], human: RELEASE_ONLY}
  REVENUE_OFFER: {primary: REVENUE, secondary: [SECURITY, COMMS], human: REQUIRED}
  PHYSICAL_SOC_FAILURE: {primary: SECURITY, secondary: [COMMAND], human: WHEN_CONSEQUENTIAL}
  PUBLIC_COMMUNICATION: {primary: COMMS, secondary: [SECURITY], human: MATERIAL_RELEASES}
  HARDWARE_DISCOVERY: {primary: INTELLIGENCE, secondary: [SECURITY, EARTH], human: PURCHASE_OR_DEPLOYMENT}

living_lab_record:
  required: [RUN_ID, OBJECTIVE, WORKER, DIMENSION, FACT, RISK, ACTION, EVIDENCE, RESULT, ROOT_CAUSE, RECOVERY, SKILLS_DEMONSTRATED, MENTOR_GRADE, TRAINING_OUTPUT, PORTFOLIO_OUTPUT, AUTOMATION_CANDIDATE, REINJECTION_TARGET]

unc_mentor_grade:
  dimensions: [TECHNICAL_EXECUTION, EVIDENCE_QUALITY, ANALYSIS, SECURITY_JUDGMENT, RECOVERY, COMMUNICATION]
  levels:
    0: NOT_DEMONSTRATED
    1: GUIDED
    2: ASSISTED
    3: INDEPENDENT
    4: ADVANCED
    5: MENTOR_DESIGN_AUTHORITY
  correction_rule: ONE_MATERIAL_CORRECTION_PER_CYCLE_UNLESS_SAFETY_REQUIRES_MORE

proactive_intelligence:
  observe: [MARKET, TECHNOLOGY, THREATS, CI, LAB_HEALTH, HARDWARE, COST, PERFORMANCE, EMPLOYMENT, REVENUE, USER_EXPERIENCE]
  creates: [SIGNAL, SEED, MEMORY, CAPABILITY, DOCUMENTED_REJECTION]
  never_creates: UNAUTHORIZED_ACTION

superstate:
  reconcile: [AUTHORITY_STATE, MACHINE_STATE, EVIDENCE_STATE, WORKER_STATE, NEXT_ACTION]
  disagreement_state: HOLD

current_operating_state:
  COMMS: ACTIVE
  PRIVATE_CREDIT_SIGNAL: {state: MATERIAL, classification: PRIVATE_EXCLUDED, approval: NEEDS_APPROVAL}
  HUMAN_COMMAND: CREDIT_REVIEW_REQUIRED_THROUGH_KNOWN_OFFICIAL_CHANNEL
  TECHNOLOGY_SIGNALS: {route: INTELLIGENCE, architecture_authority: false}
  CI: {latest_known_signal: e106abb_FAILURE, security_state: HOLD}
  ACTIVE_PHYSICAL_GATE: LINK-01_HP_RECEIVER_VERIFICATION
  EMPLOYMENT: REMOTE_ONLY_ADVISORY
  EXTERNAL_EMPLOYMENT_RELEASE: CLOSED
  SOFTWARE_INSTALL: NONE
  MONEY_MOVEMENT: NONE
  CREDENTIAL_ACTION: NONE

immediate_ordered_actions:
  P1: {owner: HUMAN_COMMAND, action: Review credit-monitoring alert independently through known official account channel}
  P2: {owner: SECURITY, action: Hold CI trust until exact-head evidence supersedes e106abb}
  P3: {owner: INTELLIGENCE, action: Research AI reliability, autonomous-response, and MCP signals under CRAYOLA-Q}
  P4: {owner: COMMAND, action: Preserve LINK-01 as active physical gate}
  P5: {owner: [REVENUE, COMMS], action: Continue remote employment preparation internally only}
  P6: {owner: UNC, action: Collect evidence, grade cycle, identify one material improvement, reinject}

final_law:
  - SENSE_WITHOUT_PANIC
  - VERIFY_WITHOUT_ASSUMPTION
  - ACT_WITHOUT_OVERREACH
  - RECORD_WITHOUT_EXPOSING_PRIVATE_DATA
  - LEARN_WITHOUT_LOOPING
  - REINJECT_WITHOUT_LOSING_LINEAGE
  - INCREASE_VERIFIED_VALUE_VELOCITY_WITHOUT_SACRIFICING_TRUTH
integration_state: FULL_OPS_SOP_READY_FOR_CCC_LIVING_LAB_INTEGRATION
